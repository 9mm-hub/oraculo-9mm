<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oráculo 9mm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Pixelify+Sans:wght@400;600&family=Inter:wght@600&display=swap">
<style>
  /* Layout: uma coluna para tablet em pé — título, a Pítia em gravura com a bola em pixel nas mãos, o balão pixel com a profecia logo abaixo. */
  :root {
    --paper: #FBF7F2;
    --ink: #2B2B2B;
    --soft: #6B665E;
    --gold: #C9A45C;
    --gold-deep: #9C7A36;
    --display: "Playfair Display", "Bodoni 72", Didot, Georgia, serif;
    --pixel: "Pixelify Sans", "Courier New", monospace;
    --ui: "Inter", system-ui, sans-serif;
    --chrome: 350px;
    color-scheme: light;
  }
  @media (max-height: 760px) { :root { --chrome: 310px; } }
  @media (min-height: 1100px) { :root { --chrome: 400px; } }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--paper); color: var(--ink); font-family: var(--ui); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  main {
    min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(8px, 1.6vh, 18px); text-align: center;
    padding-block: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .kicker { font-family: var(--ui); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--soft); margin: 0; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, min(7.5vw, 5.5vh), 4rem); line-height: 0.95; letter-spacing: 0.03em; margin: 0; text-wrap: balance; }
  h1 em { display: block; font-weight: 500; font-size: 0.45em; color: var(--gold-deep); letter-spacing: 0; margin-top: 8px; }
  .stage { position: relative; width: min(1000px, 96vw, calc((100vh - var(--chrome)) * 0.75)); max-width: 100%; aspect-ratio: 3 / 4; }
  @supports (height: 100dvh) { .stage { width: min(1000px, 96vw, calc((100dvh - var(--chrome)) * 0.75)); } }
  .figure { position: absolute; inset: 0; transform-origin: 50% 100%; animation: breathe 6s ease-in-out infinite; }
  .figure img { width: 100%; height: 100%; display: block; }
  @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.006); } }
  .stage.reveal .figure { animation: tremble 650ms ease-in-out, breathe 6s ease-in-out 650ms infinite; }
  @keyframes tremble { 0%,100% { transform: none; } 20% { transform: translateX(-3px) rotate(-0.5deg); } 40% { transform: translateX(3px) rotate(0.5deg); } 60% { transform: translateX(-2px); } 80% { transform: translateY(-5px) scale(1.01); } }
  .halo { position: absolute; left: 50%; top: 22%; width: 56%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, rgba(201,164,92,0.55), rgba(201,164,92,0) 65%); opacity: 0; pointer-events: none; }
  .stage.reveal .halo { animation: glow 1.6s ease-out; }
  @keyframes glow { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
  .ball { position: absolute; left: 50%; top: 74.6%; width: 56%; aspect-ratio: 1; translate: -50% -50%; border: 0; padding: 0; background: none; cursor: pointer; image-rendering: pixelated; }
  .ball canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .ball:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: -12%; border-radius: 50%; }
  .tap { position: absolute; left: 50%; top: 92%; translate: -50% 0; font-family: var(--pixel); font-weight: 600; font-size: clamp(0.8rem, 2.6vw, 1rem); letter-spacing: 0.1em; color: var(--ink); background: var(--paper); padding: 2px 8px; animation: blink 1.1s steps(2, jump-none) infinite; pointer-events: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .balloon {
    position: relative; width: min(1000px, 100%); box-sizing: border-box; margin-top: 10px;
    background: #fff; color: var(--ink); padding: 16px 20px; min-height: 5.2em; display: grid; place-items: center;
    box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
  }
  .balloon::before, .balloon::after { content: ""; position: absolute; left: 50%; width: 4px; height: 4px; background: var(--ink); }
  .balloon::before { top: -8px; translate: -8px 0; box-shadow: 4px -4px 0 var(--ink), 8px -8px 0 var(--ink), 12px -4px 0 var(--ink), 16px 0 0 var(--ink), 4px 0 0 #fff, 8px 0 0 #fff, 12px 0 0 #fff, 8px -4px 0 #fff; }
  .balloon::after { display: none; }
  .balloon p { margin: 0; font-family: var(--pixel); font-size: clamp(1rem, 3.4vw, 1.7rem); line-height: 1.35; text-wrap: balance; }
  .balloon p.wait { color: var(--soft); }
  .caret { display: inline-block; width: 0.5em; height: 1em; background: var(--ink); vertical-align: -0.15em; margin-left: 2px; animation: blink 0.8s steps(2, jump-none) infinite; }
  .sign { font-family: var(--display); font-style: italic; font-weight: 500; color: var(--gold-deep); margin: 0; font-size: 0.95rem; }
  @media (min-width: 900px) and (min-height: 1400px) { html { font-size: 160%; } :root { --chrome: 560px; } }
  @media (prefers-reduced-motion: reduce) { .figure, .stage.reveal .figure, .tap, .caret { animation: none; } }
</style>
</head>

    <span class="tap" id="tap" aria-hidden="true">▲ TOQUE AQUI</span>
  </div>
  <div class="balloon" aria-live="polite"><p class="wait" id="txt">O Oráculo está esperando a sua pergunta…</p></div>
  <p class="sign">Ideias divinas. Prazos mortais.</p>
</main>

<script>
(() => {
  const prophecies = [
    "Os astros revelam: seu próximo job será aprovado de primeira. Os deuses, porém, não garantem o cliente.",
    "Zeus viu o seu 2027: menos refação, mais aprovação. O raio só cai no concorrente.",
    "Hermes trará um briefing claro como o céu do Olimpo. Aproveite, isso acontece uma vez por milênio.",
    "Atena sopra no seu ouvido: a melhor ideia de 2027 vai surgir no banho. Tenha um bloco à prova d'água.",
    "Hera prevê que aquele \"só um ajuste\" será mesmo só um ajuste. Acredite. Ou não.",
    "O Oráculo enxerga um prazo generoso no seu horizonte. Desconfie, pode ser miragem.",
    "Dionísio decretou: seu próximo ano terá mais brindes do que reuniões.",
    "Apolo ilumina seu caminho: o próximo conceito será lindo. A copy também. E a trilha, idem.",
    "Prometeu jura que em 2027 você vai entregar antes do prazo. Pelo menos uma vez.",
    "As Moiras já teceram seu destino: um job épico, uma campanha premiada e um final_v1 que será, de fato, o final."
  ];
  // bola de cristal em pixel art: grade de 72x72, esfera no centro, faíscas em volta
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const N = 72, R = 21, CX = 36, CY = 36;
  const PAL = ["#2B2B2B", "#6E5523", "#9C7A36", "#C9A45C", "#E6CF97", "#FBF7F2", "#FFFFFF"];
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  let boost = 0, sparks = [], t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = x + 0.5 - CX, dy = y + 0.5 - CY, d = Math.hypot(dx, dy);
      if (d > R + 1) continue;
      if (d > R) { ctx.fillStyle = PAL[0]; ctx.fillRect(x, y, 1, 1); continue; }
      const r = d / R, a = Math.atan2(dy, dx);
      const swirl = 0.5 + 0.5 * Math.sin(a * 2 + r * 7 - t * 1.6) * Math.cos(r * 4 + t * 0.9);
      const light = 1 - Math.hypot(dx + 7, dy + 8) / (R * 1.9);
      let v = 0.5 + light * 0.45 + swirl * (0.24 + boost * 0.4) - r * r * 0.5 + boost * 0.3;
      v += (BAYER[y & 3][x & 3] / 16 - 0.5) * 0.22;
      let idx = Math.max(1, Math.min(5, Math.round(v * 5)));
      if (r > 0.9) idx = Math.min(idx, 2);
      ctx.fillStyle = PAL[idx]; ctx.fillRect(x, y, 1, 1);
    }
    // brilho especular
    ctx.fillStyle = PAL[6]; ctx.fillRect(CX - 12, CY - 13, 3, 2); ctx.fillRect(CX - 13, CY - 11, 2, 3); ctx.fillRect(CX - 9, CY - 14, 2, 1);
    // faíscas
    if (Math.random() < 0.08 + boost * 0.6) { const a = Math.random() * Math.PI * 2, rr = R + 3 + Math.random() * (8 + boost * 10); sparks.push({ x: CX + Math.cos(a) * rr, y: CY + Math.sin(a) * rr, life: 1, big: Math.random() < 0.4 }); }
    for (const s of sparks) {
      s.life -= 0.025; const x = Math.round(s.x), y = Math.round(s.y);
      ctx.fillStyle = s.life > 0.5 ? PAL[3] : PAL[2];
      ctx.fillRect(x, y, 1, 1);
      if (s.big && s.life > 0.3) { ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x, y + 1, 1, 1); }
    }
    sparks = sparks.filter((s) => s.life > 0);
    boost = Math.max(0, boost - 0.012);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const stage = document.getElementById("stage"), txt = document.getElementById("txt"), tap = document.getElementById("tap");
  let current = -1, typing = null;
  function type(text) {
    clearInterval(typing); txt.classList.remove("wait"); txt.textContent = "";
    const caret = document.createElement("span"); caret.className = "caret";
    let i = 0; txt.appendChild(caret);
    typing = setInterval(() => {
      i += 1; txt.textContent = text.slice(0, i); txt.appendChild(caret);
      if (i >= text.length) { clearInterval(typing); setTimeout(() => caret.remove(), 1600); }
    }, 28);
  }
  function consult() {
    let next; do { next = Math.floor(Math.random() * prophecies.length); } while (next === current);
    current = next; boost = 1; tap.hidden = true;
    stage.classList.remove("reveal"); void stage.offsetWidth; stage.classList.add("reveal");
    txt.textContent = "…"; txt.classList.add("wait");
    setTimeout(() => type(prophecies[next]), 550);
  }
  document.getElementById("ball").addEventListener("click", consult);
})();
</script>
